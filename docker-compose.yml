services:
  backend:
    build:
      context: ./FocusBoard-backend
    env_file:
      - ./.env
    environment:
      WORKERS: "1"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
